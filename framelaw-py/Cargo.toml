[package]
name = "framelaw-py"
version = "0.2.0"
edition = "2021"

[lib]
name = "framelaw"
crate-type = ["cdylib"]

[dependencies]
framelaw-core = { path = "../framelaw-core" }
jiter = "0.5"
# abi3: one wheel per platform covers CPython 3.10+, instead of one per interpreter.
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py310"] }
pyo3-polars = { version = "0.28.0", features = ["dtype-struct", "dtype-array"] }
polars = { version = "0.55.2", default-features = false, features = ["lazy", "strings", "regex", "temporal", "dtype-struct", "dtype-array", "dtype-i128", "dtype-u128", "dtype-f16"] }
rand = "0.9"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
