[package]
name = "framelaw-py"
version = "0.1.0"
edition = "2021"

[lib]
name = "framelaw"
crate-type = ["cdylib"]

[dependencies]
framelaw-core = { path = "../framelaw-core" }
pyo3 = { version = "0.29.2", features = ["extension-module"] }
pyo3-polars = "0.28.0"
polars = { version = "0.55.2", default-features = false, features = ["lazy", "strings", "regex", "temporal"] }
regex = "1.11"
