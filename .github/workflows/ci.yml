name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  quality:
    name: Lint and static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Ruff lint and format check
        run: |
          uvx ruff check framelaw-py scripts
          uvx ruff format --check framelaw-py scripts
      - name: Type check
        run: |
          test -d .venv || uv venv
          uv pip install -q ty polars pydantic
          uv run ty check --extra-search-path framelaw-py/python framelaw-py/python scripts
      - name: Docstring coverage
        run: uvx interrogate framelaw-py/python scripts

  test:
    name: Build and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create venv and build extension
        run: |
          test -d .venv || uv venv
          uv pip install -e ./framelaw-py
      - name: Rust tests
        run: cargo test -p framelaw-core
      - name: Scripts smoke test
        run: |
          for script in scripts/*.py; do
            uv run --with-editable ./framelaw-py python "$script"
          done
