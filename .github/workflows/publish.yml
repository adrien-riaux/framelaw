name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  gate:
    name: Pre-publish gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test -p framelaw-core
      - name: Ruff lint and format check
        run: |
          uvx ruff check framelaw-py examples
          uvx ruff format --check framelaw-py examples
      - name: Type check
        run: |
          uv venv
          uv pip install -q ty polars pydantic
          uv run ty check --extra-search-path framelaw-py/python framelaw-py/python examples
      - name: Docstring coverage
        run: uvx interrogate framelaw-py/python examples

  build:
    name: Build wheels and sdist
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --manifest-path framelaw-py/Cargo.toml --find-interpreter
          manylinux: auto
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path framelaw-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    if: contains(github.ref_name, '-rc.')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: ${{ !contains(github.ref_name, '-rc.') }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Attach assets to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
