[package]
name = "framelaw-core"
version = "0.4.1"
edition = "2021"
description = "Pure-Rust schema validation engine for Polars DataFrames"
license = "MIT"
repository = "https://github.com/adrien-riaux/framelaw"

[dependencies]
polars = { version = "0.55.2", default-features = false, features = ["lazy", "strings", "regex", "temporal", "dtype-struct", "dtype-array", "dtype-i128", "dtype-u128", "dtype-f16"] }
rand = "0.9"
rand_chacha = "0.9"
rayon = "1.10.0"
regex = "1.10.4"
jiter = "0.5"
